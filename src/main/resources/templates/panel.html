<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Belge Üretim Paneli · TrustLayer</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:replace="~{ortak :: ust('panel')}"></header>
<main>
    <h1>Belge Üretim Paneli</h1>
    <p class="giris" th:if="${kurumId}">
        Aktif kurum: <strong th:text="${kurumId}"></strong>
    </p>
    <ol class="adimlar">
        <li>1 · Şablondan üret</li>
        <li>2 · Kurum anahtarıyla imzala</li>
        <li>3 · İndir</li>
    </ol>

    <p class="uyari" th:if="${kurumId != null and #lists.isEmpty(secenekler)}">
        Bu kurum için henüz belge şablonu tanımlanmamış.
    </p>

    <form method="post" th:action="@{/panel}" th:unless="${#lists.isEmpty(secenekler)}">
        <label>Belge türü
            <select name="belge">
                <option th:each="s : ${secenekler}"
                        th:value="${s.deger()}"
                        th:attr="data-ipucu=${s.ipucu()}"
                        th:text="${s.etiket()}">
                </option>
            </select>
        </label>
        <label>Kayıt no <span class="ipucu"></span>
            <input name="kayitNo" required>
        </label>
        <button type="submit">İmzalı belgeyi üret ve indir</button>
    </form>

    <form method="post" th:action="@{/logout}">
        <button type="submit" style="background: var(--soluk);">Oturumu kapat</button>
    </form>

    <p class="hata" th:if="${hata}" th:text="${hata}"></p>
</main>
<footer th:replace="~{ortak :: alt}"></footer>
<script>
    const tur = document.querySelector('select[name=belge]');
    const ipucu = document.querySelector('.ipucu');
    const ipucuGoster = () => {
        if (tur && tur.selectedOptions.length > 0) {
            ipucu.textContent = tur.selectedOptions[0].dataset.ipucu;
        }
    };
    if (tur) {
        tur.addEventListener('change', ipucuGoster);
        ipucuGoster();
    }
</script>
</body>
</html>
