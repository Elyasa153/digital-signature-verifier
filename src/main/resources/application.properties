spring.application.name=digital-signature-verifier

# Anahtarlar, CA dosyaları ve CRL burada tutulur; klasör .gitignore'da.
dsv.runtime-dir=runtime
# Keystore parolası yalnız ortam değişkeninden gelir, repoya yazılmaz.
dsv.keystore-password=${DSV_KEYSTORE_PASSWORD:}
# QR kodun açacağı doğrulama sayfası.
dsv.verify-base-url=http://localhost:8080/dogrula
# Kurum sertifikalarına yazılan CRL adresi (CRL Distribution Point).
dsv.crl-url=http://localhost:8080/crl

# Deneydeki en büyük belge 10 MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Sınırı aşan yüklemenin kalanı okunup atılır; yoksa Tomcat bağlantıyı keser, kullanıcı hata mesajını göremez.
server.tomcat.max-swallow-size=100MB

# Şablonları dolduran sentetik kayıtlar (K9): <records-dir>/<kurum>/<tür>.csv
dsv.records-dir=data/records

# E-posta gönderimi (SMTP): spring.mail.host ayarlıysa gerçek e-posta gider, boşsa kod günlüğe yazılır (demo modu).
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
dsv.mail.from=noreply@trustlayer.local
