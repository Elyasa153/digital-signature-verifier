spring.application.name=digital-signature-verifier

# Anahtarlar, CA dosyaları ve CRL burada tutulur; klasör .gitignore'da.
dsv.runtime-dir=runtime
# Keystore parolası yalnız ortam değişkeninden gelir, repoya yazılmaz.
dsv.keystore-password=${DSV_KEYSTORE_PASSWORD:}
# QR kodun açacağı doğrulama sayfası.
dsv.verify-base-url=http://localhost:8080/dogrula
# Kurum sertifikalarına yazılan CRL adresi (CRL Distribution Point).
dsv.crl-url=http://localhost:8080/crl

# Deneydeki en büyük belge 10 MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Şablonları dolduran sentetik kayıtlar (K9): <records-dir>/<kurum>/<tür>.csv
dsv.records-dir=data/records
